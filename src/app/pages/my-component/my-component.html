<div class="@container mx-auto flex w-full max-w-5xl flex-auto flex-col gap-4 p-6 sm:gap-8 lg:px-8 lg:py-10">

    <!-- ENCABEZADO -->
    <div class="mb-4 flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
        <div>
            <h1 class="text-3xl font-bold leading-tight">
                Categorías de la Biblioteca
            </h1>

            <p class="mt-1 text-secondary">
                Explora las categorías o registra una nueva.
            </p>
        </div>

        <button
            mat-flat-button
            color="primary"
            (click)="openForm()"
        >
            <mat-icon>add</mat-icon>
            Nueva categoría
        </button>
    </div>

    <!-- FORMULARIO NUEVA CATEGORÍA -->
    @if (showForm()) {
        <div class="rounded-xl border bg-card p-6 shadow-sm">
            <h2 class="text-lg font-semibold">
                Registrar nueva categoría
            </h2>

            <div class="mt-4 flex flex-col gap-4">
                <mat-form-field class="w-full">
                    <mat-label>Nombre de la categoría</mat-label>
                    <input
                        matInput
                        [value]="newCategoryName()"
                        (input)="newCategoryName.set($any($event.target).value)"
                        placeholder="Ej. Historia"
                    />
                </mat-form-field>

                <mat-form-field class="w-full">
                    <mat-label>Descripción</mat-label>
                    <input
                        matInput
                        [value]="newCategoryDescription()"
                        (input)="newCategoryDescription.set($any($event.target).value)"
                        placeholder="Describe la categoría"
                    />
                </mat-form-field>
            </div>

            <div class="mt-4 flex gap-3">
                <button
                    mat-flat-button
                    color="primary"
                    (click)="addCategory()"
                >
                    Guardar
                </button>

                <button
                    mat-stroked-button
                    (click)="cancelForm()"
                >
                    Cancelar
                </button>
            </div>
        </div>
    }

    <!-- VISTA CATEGORÍAS -->
    <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3">
        @for (category of categories(); track category) {
            <div
                class="flex cursor-pointer flex-col items-start rounded-xl border p-5 shadow-sm transition-shadow hover:shadow-lg"
                (click)="goToCategory(category)"
            >
                <div class="mb-4 flex size-12 items-center justify-center rounded-lg bg-gray-100">
                    <mat-icon class="!size-8 !text-3xl">
                        menu_book
                    </mat-icon>
                </div>

                <h2 class="text-lg font-semibold">
                    {{ category }}
                </h2>

                <p class="mt-1 text-sm text-secondary">
                    Ver libros de esta categoría
                </p>
            </div>
        }
    </div>

</div>
