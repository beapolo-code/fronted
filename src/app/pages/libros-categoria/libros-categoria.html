<div class="p-6">

    <!-- ENCABEZADO -->
    <div class="mb-8">

        <button
            mat-button
            (click)="volver()"
            class="mb-4"
        >
            <span class="mr-2">⬅️</span>
            Volver a categorías
        </button>

        <h1 class="text-3xl font-bold">
            {{ categoria() }}
        </h1>

        <p class="mt-1 text-secondary">
            Libros disponibles en esta categoría
        </p>

    </div>


    <!-- LIBROS -->
    @if (filteredBooks.length > 0) {

        <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3">

            @for (book of filteredBooks; track book.title) {

                <div class="rounded-xl border p-5 shadow-sm">

                    <!-- ICONO -->
                    <div class="mb-4 flex h-40 items-center justify-center rounded-lg bg-gray-100">

                        <mat-icon class="!h-16 !w-16 !text-6xl">
                            menu_book
                        </mat-icon>

                    </div>

                    <!-- INFORMACIÓN -->
                    <h2 class="text-lg font-semibold">
                        {{ book.title }}
                    </h2>

                    <p class="mt-1 text-secondary">
                        {{ book.author }}
                    </p>

                    <div class="mt-5">

                        <button
                            mat-flat-button
                            color="primary"
                        >
                            <mat-icon>visibility</mat-icon>
                            Ver libro
                        </button>

                    </div>

                </div>

            }

        </div>

    }

    @else {

        <div class="rounded-xl border p-10 text-center">

            <div class="mb-4">
                📚
            </div>

            <h2 class="text-xl font-semibold">
                No hay libros
            </h2>

            <p class="mt-1 text-secondary">
                Esta categoría todavía no tiene libros registrados.
            </p>

        </div>

    }

</div>
